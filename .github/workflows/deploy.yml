name: deploy

on:
  push:
    branches: [main]
    paths: ['blueharbor_sprint2/**']
  workflow_dispatch: # rideploy manuale senza commit vuoto (es. run fallita per un flake)

# Un deploy alla volta, in ordine: due merge ravvicinati non possono
# sorpassarsi e far vincere lo SHA piu' vecchio.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # I test girano PRIMA del build: un merge con un test rosso non deploya.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test blueharbor_sprint2

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push immagine
        uses: docker/build-push-action@v6
        with:
          context: blueharbor_sprint2
          push: true
          tags: |
            ghcr.io/lufo-336/blueharbor:latest
            ghcr.io/lufo-336/blueharbor:${{ github.sha }}

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy per SHA, non per latest: ogni revisione della Container App
      # dice esattamente quale commit sta servendo.
      - name: Aggiorna la Container App
        run: |
          az containerapp update --name app-blueharbor --resource-group rg-blueharbor \
            --image ghcr.io/lufo-336/blueharbor:${{ github.sha }}
