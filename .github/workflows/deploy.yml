name: deploy

on:
  push:
    branches: [main]
    paths: ['blueharbor_sprint2/**']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push immagine
        uses: docker/build-push-action@v6
        with:
          context: blueharbor_sprint2
          push: true
          tags: |
            ghcr.io/lufo-336/blueharbor:latest
            ghcr.io/lufo-336/blueharbor:${{ github.sha }}

      - name: Login Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy per SHA, non per latest: ogni revisione della Container App
      # dice esattamente quale commit sta servendo.
      - name: Aggiorna la Container App
        run: |
          az containerapp update --name app-blueharbor --resource-group rg-blueharbor \
            --image ghcr.io/lufo-336/blueharbor:${{ github.sha }}
