# ═══ SPRINT 9 ═══ Il browser parla solo con nginx: /api → backend.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;    # "backend" = nome del servizio compose
        proxy_set_header Host $host;
    }

    # SPA: ogni percorso non-file torna a index.html.
    location / {
        try_files $uri /index.html;
    }
}
