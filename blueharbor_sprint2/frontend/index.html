<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlueHarbor Terminal</title>
    <!-- Imposta tema e lingua PRIMA del render (no flash chiaro->scuro, <html lang> coerente). -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('blueharbor_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
          var l = localStorage.getItem('blueharbor_lang');
          if (l !== 'it' && l !== 'en') {
            l = (navigator.language || '').toLowerCase().indexOf('en') === 0 ? 'en' : 'it';
          }
          document.documentElement.lang = l;
        } catch (e) { /* localStorage non disponibile: si usano i default (tema chiaro, lingua it) */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
