# ============================================================================
#  BlueHarbor — demo con un comando: `docker compose up --build`
#  Due servizi: SQL Server + l'app (API + SPA sulla stessa porta).
#  L'app si auto-inizializza (EnsureCreated + seed) quando il db è healthy,
#  quindi non serve applicare a mano gli script SQL.
#  App raggiungibile su http://localhost:8080  (login: admin@blueharbor / admin123)
# ============================================================================
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Str0ng_Passw0rd!}"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # sqlcmd 18 è in /opt/mssql-tools18/bin; -C = fidati del certificato self-signed.
      # $$ = passa un $ letterale, così è il container a espandere la sua env var
      # (con un solo $ sarebbe compose a interpolarla lato host → password vuota).
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      # Punta al servizio db; TrustServerCertificate per il cert self-signed di SQL Server.
      ConnectionStrings__DefaultConnection: "Server=db;Database=BlueHarbor;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Str0ng_Passw0rd!};TrustServerCertificate=True;"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssql-data:
